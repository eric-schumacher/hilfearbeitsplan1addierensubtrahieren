<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schriftliches Addieren – Ziffern</title>
<style>
:root{--ink:#202428;--green:#2d9b62;--gold:#edb419;--grid:rgba(91,111,102,.2);--cell:120px;--op:56px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 8%,#fff 0,#f3f8f5 50%,#dbe9e2 100%);-webkit-tap-highlight-color:transparent}.shell{width:100vw;height:100svh;padding:clamp(8px,1.45vw,22px)}.lesson{position:relative;width:min(1800px,100%);height:100%;margin:auto;overflow:hidden;border:1px solid rgba(65,94,81,.18);border-radius:clamp(18px,2.3vw,34px);background:rgba(255,255,255,.9);box-shadow:0 22px 60px rgba(47,79,64,.14)}
.prompt{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.96);transition:opacity .65s,visibility .65s}.prompt.hide{opacity:0;visibility:hidden}.title{position:absolute;top:22%;margin:0;color:#50635a;font-size:clamp(26px,4.1vmin,62px);font-weight:900}.task-input{position:absolute;top:40%;width:min(84%,1150px);height:clamp(82px,15vh,150px);padding:.25em .45em;border:3px solid #9bada4;border-radius:22px;background:#fff;text-align:center;font:900 clamp(29px,5.8vmin,82px)/1 Arial;outline:none}.task-input:focus{border-color:var(--green);box-shadow:0 0 0 6px rgba(45,155,98,.12)}.error{position:absolute;top:58%;color:#c54848;font-size:clamp(15px,2vmin,28px);font-weight:800;opacity:0}.error.show{opacity:1}.button{position:absolute;top:68%;padding:clamp(13px,1.9vh,22px) clamp(38px,5vw,76px);border:0;border-radius:18px;background:var(--gold);color:#302407;box-shadow:0 5px 0 #b68108,0 12px 28px rgba(135,98,4,.18);font-size:clamp(21px,2.7vmin,40px);font-weight:900;cursor:pointer}.button:active{translate:0 4px;box-shadow:0 1px 0 #b68108}
.board{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .5s}.board.ready{opacity:1}.grid{position:relative;display:grid;grid-template-columns:var(--op) repeat(var(--cols),var(--cell));grid-template-rows:calc(var(--cell)*.38) repeat(var(--rows),var(--cell)) calc(var(--cell)*.18) var(--cell);font-variant-numeric:tabular-nums}.head,.cell,.linecell{position:relative;display:grid;place-items:center}.head{color:#64776e;font-size:clamp(9px,1.4vmin,21px);font-weight:900;opacity:0;transition:opacity .8s}.cell{font-size:calc(var(--cell)*.62);font-weight:900;line-height:1}.cell:before{content:"";position:absolute;inset:0;z-index:-1;border-top:1px solid var(--grid);border-left:1px solid var(--grid);background:rgba(247,249,248,.42);opacity:0;transition:opacity .8s}.board.grid-visible .head,.board.grid-visible .cell:before{opacity:1}.digit{transform:translate(var(--sx),var(--sy)) scale(var(--start-scale,1));transition:transform 4.7s cubic-bezier(.22,.72,.18,1);will-change:transform}.board.arranged .digit{transform:none}.plus{color:var(--green);font-size:calc(var(--cell)*.36)}.decimal{position:absolute;left:92%;bottom:.08em;font-size:.48em;font-weight:600;opacity:1;transition:opacity .7s ease 3.8s}.board.arranged .decimal{opacity:0}.digit-body{position:relative;display:inline-block}.calc-line{grid-column:2/calc(var(--cols) + 2);width:100%;height:clamp(4px,.6vmin,8px);border-radius:99px;background:#27332d;transform:scaleX(0);transform-origin:left;transition:transform 3.8s cubic-bezier(.4,0,.2,1)}.board.line .calc-line{transform:scaleX(1)}.result{color:#171c19}.result-value{opacity:0;transform:scale(.72);transition:opacity .55s,transform .55s}.result.show .result-value{opacity:1;transform:scale(1)}.result.settled .result-value{opacity:1}.carry{position:absolute;z-index:12;color:#2d9b62;font-size:calc(var(--cell)*.24);font-weight:900;line-height:1;translate:-50% -100%;transition:opacity .6s,color .6s}.carry.used{color:#7e8b85;opacity:.34}.fly-carry{position:absolute;z-index:15;font-weight:900;color:var(--green);line-height:1;pointer-events:none;will-change:left,top,font-size}.double{position:absolute;left:var(--op);right:0;bottom:0;display:grid;gap:clamp(5px,.65vmin,9px);padding-bottom:3px}.double i{height:clamp(3px,.45vmin,7px);border-radius:99px;background:#27332d;transform:scaleX(0);transform-origin:left;transition:transform 2.5s cubic-bezier(.4,0,.2,1)}.double i:nth-child(2){transition-delay:.35s}.board.done .double i{transform:scaleX(1)}.restart{position:absolute;z-index:30;left:50%;top:50%;translate:-50% calc(-50% + 12px);padding:clamp(16px,2.2vh,27px) clamp(38px,5vw,78px);border:0;border-radius:20px;background:var(--green);color:#fff;box-shadow:0 5px 0 #1d7448,0 14px 36px rgba(35,120,76,.24);font-size:clamp(24px,3.2vmin,48px);font-weight:900;opacity:0;visibility:hidden;cursor:pointer;transition:opacity .9s,visibility .9s,translate .9s}.restart.show{opacity:1;visibility:visible;translate:-50% -50%}
.digit.column-used .digit-body{color:#7e8b85;opacity:.32;transition:color .75s,opacity .75s}.fall-token,.fall-plus{position:absolute;z-index:15;translate:-50% -50%;font-weight:900;line-height:1;pointer-events:none;will-change:left,top,font-size;transition:opacity .65s}.fall-token.carry-term{color:var(--green)}.fall-plus{color:var(--green)}.fly-carry{translate:-50% -100%}.split-part{position:absolute;z-index:16;translate:-50% -50%;font-weight:900;line-height:1;pointer-events:none;will-change:left,top,font-size,color}.split-part.carry-part{transition:color .85s}.result-value{transition-duration:1.1s}.portrait{display:none}@media(orientation:portrait){.lesson{display:none}.portrait{display:flex;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:1.5vh;text-align:center;color:#34483e}.portrait b{font-size:clamp(25px,7vw,50px)}.portrait span{font-size:clamp(16px,4.2vw,28px);color:#61756a}.rotate{font-size:clamp(60px,20vw,130px);color:var(--green)}}
</style>
</head>
<body><main class="shell"><section class="lesson" id="lesson">
<div class="prompt" id="prompt"><p class="title">Gib hier deine Additionsaufgabe ein!</p><input class="task-input" id="taskInput" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="z. B. 125.684 + 79.328"><div class="error" id="error"></div><button class="button" id="solve">lösen!</button></div>
<div class="board" id="board"><div class="grid" id="grid"></div></div><div id="flyLayer"></div><button class="restart" id="restart">Weitere Aufgabe</button>
</section><aside class="portrait"><div class="rotate">↻</div><b>Bitte drehe dein Gerät.</b><span>Diese App funktioniert nur im Querformat.</span></aside></main>
<script>
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],lesson=q('#lesson'),prompt=q('#prompt'),input=q('#taskInput'),error=q('#error'),solve=q('#solve'),board=q('#board'),grid=q('#grid'),flyLayer=q('#flyLayer'),restart=q('#restart');
const names=['Einer','Zehner','Hunderter','Tausender','Zehntausender','Hunderttausender','Millionen','Zehnmillionen','Hundertmillionen','Milliarden','Zehnmilliarden','Hundertmilliarden','Billionen','Zehnbillionen','Hundertbillionen','Billiarden'];let numbers=[],cols=0,rows=0,cells=[],resultCells=[],carryEls=[],skipCurrent=null,busy=false;
const wait=ms=>new Promise(resolve=>{let done=false,id=setTimeout(finish,ms);function finish(){if(done)return;done=true;clearTimeout(id);skipCurrent=null;resolve()}skipCurrent=finish});
function grouped(s){return s.replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function parseInput(){const parts=input.value.split('+').map(v=>v.trim().replace(/\./g,'')).filter(Boolean);if(parts.length<2||parts.length>4||parts.some(v=>!/^\d+$/.test(v)||v.length>15)){error.textContent='Bitte gib zwei bis vier natürliche Zahlen mit Pluszeichen ein.';error.classList.add('show');return null}return parts.map(v=>v.replace(/^0+(?=\d)/,'')||'0')}
function sizeGrid(){const r=lesson.getBoundingClientRect(),availableW=r.width*.94,availableH=r.height*.9,cell=Math.max(42,Math.min(180,availableW/(cols+1),availableH/(rows+1.62)));board.style.setProperty('--cell',cell+'px');board.style.setProperty('--op',Math.max(30,cell*.42)+'px')}
function build(){rows=numbers.length;const maxLen=Math.max(...numbers.map(n=>n.length));let sum=numbers.reduce((a,n)=>a+BigInt(n),0n).toString();cols=Math.max(maxLen,sum.length);if(cols>names.length){error.textContent='Diese Zahl ist für die Stellenwerttafel noch zu lang.';error.classList.add('show');return false}board.style.setProperty('--cols',cols);board.style.setProperty('--rows',rows);let html='<div class="head"></div>';for(let col=0;col<cols;col++)html+=`<div class="head">${names[cols-1-col]}</div>`;let order=0;numbers.forEach((number,row)=>{html+=`<div class="cell digit plus" data-order="${order++}">${row?'+':''}</div>`;const padded=number.padStart(cols,' ');for(let col=0;col<cols;col++){const value=padded[col],fromRight=cols-1-col,dot=value!==' '&&fromRight>0&&fromRight%3===0?'<span class="decimal">.</span>':'';html+=`<div class="cell digit" data-row="${row}" data-col="${col}" data-order="${order++}"><span class="digit-body">${value===' '?'':value}${dot}</span></div>`}});html+=`<div class="linecell"></div><div class="linecell calc-line" style="grid-column:2 / ${cols+2}"></div><div class="cell"></div>`;for(let col=0;col<cols;col++)html+=`<div class="cell result" data-col="${col}"><span class="result-value"></span></div>`;html+='<div class="double"><i></i><i></i></div>';grid.innerHTML=html;cells=qa('.digit');resultCells=qa('.result');sizeGrid();return true}
function startPositions(){const r=lesson.getBoundingClientRect(),visible=[];numbers.forEach((number,row)=>{if(row)visible.push(qa('.plus')[row]);const start=cols-number.length;for(let col=start;col<cols;col++)visible.push(q(`.digit[data-row="${row}"][data-col="${col}"]`))});const font=parseFloat(getComputedStyle(q('.cell')).fontSize),gap=Math.max(4,font*.08),groupGap=Math.max(18,font*.32),widths=visible.map(el=>el.classList.contains('plus')?font*.62:font*(el.querySelector('.decimal')?.parentElement? .72:.58)),total=widths.reduce((a,b)=>a+b,0)+gap*(visible.length-1)+groupGap*(rows-1),scale=Math.min(1.08,r.width*.86/total);board.style.setProperty('--start-scale',scale);let cursor=r.left+r.width/2-total*scale/2,y=r.top+r.height*.51;visible.forEach((el,i)=>{if(el.classList.contains('plus'))cursor+=groupGap*scale;const rect=el.getBoundingClientRect(),w=widths[i]*scale;el.style.setProperty('--sx',`${cursor+w/2-(rect.left+rect.right)/2}px`);el.style.setProperty('--sy',`${y-(rect.top+rect.bottom)/2}px`);cursor+=w+gap*scale})}
function digitAt(number,col){const offset=cols-number.length,index=col-offset;return index<0?0:Number(number[index])}
function sourceAt(number,row,col){if(col<cols-number.length)return null;return q(`.digit[data-row="${row}"][data-col="${col}"]`)}
async function showColumnExpression(col,carry){const result=resultCells[col],rr=result.getBoundingClientRect(),lr=lesson.getBoundingClientRect(),terms=[];numbers.forEach((number,row)=>{const source=sourceAt(number,row,col);if(source)terms.push({value:digitAt(number,col),source,carry:false})});if(carry&&carryEls[col])terms.push({value:carry,source:carryEls[col],carry:true});const baseFont=parseFloat(getComputedStyle(result).fontSize),font=Math.min(baseFont*.64,rr.width/Math.max(1,terms.length*.72+(terms.length-1)*.42)),plusFont=font*.66,widths=[];terms.forEach((_,i)=>{widths.push(font*.58);if(i<terms.length-1)widths.push(plusFont*.7)});const total=widths.reduce((a,b)=>a+b,0),targetY=rr.top-lr.top+rr.height/2;let cursor=rr.left-lr.left+(rr.width-total)/2;const pieces=[],moving=[];terms.forEach((term,i)=>{const targetX=cursor+font*.29,src=term.source.getBoundingClientRect(),el=document.createElement('span');el.className='fall-token'+(term.carry?' carry-term':'');el.textContent=term.value;el.style.left=(src.left-lr.left+src.width/2)+'px';el.style.top=(src.top-lr.top+src.height/2)+'px';el.style.fontSize=(term.carry?parseFloat(getComputedStyle(term.source).fontSize):baseFont)+'px';flyLayer.append(el);moving.push({el,sx:src.left-lr.left+src.width/2,sy:src.top-lr.top+src.height/2,ss:parseFloat(el.style.fontSize),tx:targetX,ty:targetY,ts:font});pieces.push(el);if(term.carry){term.source.remove();carryEls[col]=null}else term.source.classList.add('column-used');cursor+=font*.58;if(i<terms.length-1){const plus=document.createElement('span');plus.className='fall-plus';plus.textContent='+';plus.style.left=(cursor+plusFont*.35)+'px';plus.style.top=targetY+'px';plus.style.fontSize=plusFont+'px';plus.style.opacity='0';flyLayer.append(plus);pieces.push(plus);cursor+=plusFont*.7}});await new Promise(resolve=>{let forced=false,start=performance.now(),duration=4200;skipCurrent=()=>forced=true;function frame(now){const t=forced?1:Math.min(1,(now-start)/duration),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;moving.forEach(m=>{m.el.style.left=(m.sx+(m.tx-m.sx)*e)+'px';m.el.style.top=(m.sy+(m.ty-m.sy)*e)+'px';m.el.style.fontSize=(m.ss+(m.ts-m.ss)*e)+'px'});pieces.filter(x=>x.classList.contains('fall-plus')).forEach(x=>x.style.opacity=Math.max(0,(t-.45)/.35));if(t<1)requestAnimationFrame(frame);else{skipCurrent=null;resolve()}}requestAnimationFrame(frame)});return pieces}
async function replaceExpression(pieces,cell,raw){const span=cell.querySelector('.result-value');span.textContent=raw;cell.classList.add('show');pieces.forEach(p=>p.style.opacity='0');await wait(700);pieces.forEach(p=>p.remove())}
async function moveCarry(carryText,digitText,fromCell,toCol){const span=fromCell.querySelector('.result-value'),sr=span.getBoundingClientRect(),to=q(`.result[data-col="${toCol}"]`).getBoundingClientRect(),line=q('.calc-line').getBoundingClientRect(),lr=lesson.getBoundingClientRect(),startSize=parseFloat(getComputedStyle(span).fontSize),carryPart=document.createElement('span'),digitPart=document.createElement('span');carryPart.className='split-part carry-part';digitPart.className='split-part digit-part';carryPart.textContent=carryText;digitPart.textContent=digitText;carryPart.style.fontSize=digitPart.style.fontSize=startSize+'px';carryPart.style.visibility=digitPart.style.visibility='hidden';flyLayer.append(carryPart,digitPart);const cw=carryPart.getBoundingClientRect().width,dw=digitPart.getBoundingClientRect().width,centerX=sr.left-lr.left+sr.width/2,startY=sr.top-lr.top+sr.height/2,carryStartX=centerX-(cw+dw)/2+cw/2,digitStartX=centerX+(cw+dw)/2-dw/2;carryPart.style.left=carryStartX+'px';digitPart.style.left=digitStartX+'px';carryPart.style.top=digitPart.style.top=startY+'px';carryPart.style.visibility=digitPart.style.visibility='visible';span.style.transition='none';span.style.opacity='0';await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));carryPart.style.color='var(--green)';await wait(1000);const endX=to.left-lr.left+to.width/2,endSize=startSize*.24,endY=line.top-lr.top+line.height/2-endSize/2,digitEndX=fromCell.getBoundingClientRect().left-lr.left+fromCell.getBoundingClientRect().width/2;await new Promise(resolve=>{let forced=false,start=performance.now(),duration=4200;skipCurrent=()=>forced=true;function frame(now){const t=forced?1:Math.min(1,(now-start)/duration),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;carryPart.style.left=(carryStartX+(endX-carryStartX)*e)+'px';carryPart.style.top=(startY+(endY-startY)*e)+'px';carryPart.style.fontSize=(startSize+(endSize-startSize)*e)+'px';digitPart.style.left=(digitStartX+(digitEndX-digitStartX)*e)+'px';digitPart.style.fontSize=startSize+'px';if(t<1)requestAnimationFrame(frame);else{skipCurrent=null;resolve()}}requestAnimationFrame(frame)});const carry=document.createElement('span');carry.className='carry';carry.textContent=carryText;carry.style.left=endX+'px';carry.style.top=(line.top-lr.top+line.height/2)+'px';carry.style.fontSize=endSize+'px';span.textContent=digitText;span.style.opacity='1';span.style.transition='';carryPart.remove();digitPart.remove();flyLayer.append(carry);carryEls[toCol]=carry}
async function calculate(){let carry=0;for(let col=cols-1;col>=0;col--){const pieces=await showColumnExpression(col,carry),raw=numbers.reduce((s,n)=>s+digitAt(n,col),0)+carry,cell=resultCells[col],span=cell.querySelector('.result-value');await wait(2200);await replaceExpression(pieces,cell,raw);await wait(2300);const digit=raw%10,nextCarry=Math.floor(raw/10);if(nextCarry&&col>0){await moveCarry(String(nextCarry),String(digit),cell,col-1)}else span.textContent=digit;await wait(2900);carry=nextCarry}await wait(1000);board.classList.add('done');await wait(3500);restart.classList.add('show')}
async function begin(){if(busy)return;const parsed=parseInput();if(!parsed)return;busy=true;numbers=parsed;if(!build()){busy=false;return}board.classList.add('ready');startPositions();await wait(250);prompt.classList.add('hide');await wait(450);board.classList.add('arranged');await wait(5000);board.classList.add('grid-visible');await wait(1200);board.classList.add('line');await wait(4800);await calculate()}
solve.addEventListener('click',begin);input.addEventListener('input',()=>error.classList.remove('show'));restart.addEventListener('click',()=>location.reload());addEventListener('resize',()=>{if(numbers.length)sizeGrid()});addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();if(skipCurrent){const f=skipCurrent;skipCurrent=null;f()}else if(!busy)begin()});
</script></body></html>
