}

async function runSubtraction(){if(running)return;running=true;subtract.classList.remove('show');hideSay();for(let type=0;type<4;type++){const take=bDigits[3-type];if(!take&&!counts[type])continue;await calculatePlace(type,take)}await wait(1500);for(const type of [3,2,1,0]){const c=$(`.result[data-type="${type}"]`);c.classList.add('number');await wait(500)}board.classList.add('done');if(taskTwo){await wait(4000);finish.classList.add('show')}else{await wait(1500);nextTask.classList.add('show')}}
