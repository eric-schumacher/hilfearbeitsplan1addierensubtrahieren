async function receiveBundle(col,oldValue,newValue){const active=activeTop(col),ar=active.getBoundingClientRect(),lr=lesson.getBoundingClientRect();active.classList.add('receiver-moving');await wait(1250);active.style.opacity='0';const fresh=document.createElement('span');fresh.className='borrow-value receiver-new';fresh.innerHTML=`<span class="added-one">${Math.floor(newValue/10)}</span><span>${newValue%10}</span>`;fresh.style.left=(ar.left-lr.left+ar.width/2)+'px';fresh.style.top=(ar.top-lr.top+ar.height/2)+'px';fresh.style.fontSize=(parseFloat(getComputedStyle(active).fontSize)*.92)+'px';fresh.setAttribute('aria-label',newValue);flyLayer.append(fresh);borrowEls[col]=fresh;await wait(800);return fresh}
async function unbundle(fromCol,toCol,working){for(let col=fromCol;col<toCol;col++){const source=q(`.digit[data-row="0"][data-col="${col}"]`),target=q(`.digit[data-row="0"][data-col="${col+1}"]`),sourceActive=activeTop(col),sr=sourceActive.getBoundingClientRect(),tr=target.getBoundingClientRect(),lr=lesson.getBoundingClientRect(),flight=document.createElement('span'),startX=sr.left-lr.left+sr.width/2,startY=sr.top-lr.top+sr.height/2,endX=tr.left-lr.left+tr.width*.5,endY=tr.top-lr.top+tr.height*.5,startSize=parseFloat(getComputedStyle(sourceActive).fontSize)*.48,endSize=parseFloat(getComputedStyle(target).fontSize)*.48,oldTarget=working[col+1];working[col]-=1;await markDonor(col,working[col]);flight.className='borrow-flight';flight.textContent='1';flight.style.left=startX+'px';flight.style.top=startY+'px';flight.style.fontSize=startSize+'px';flyLayer.append(flight);await wait(700);await new Promise(resolve=>{let forced=false,start=performance.now(),duration=4200;skipCurrent=()=>forced=true;function frame(now){const t=forced?1:Math.min(1,(now-start)/duration),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;flight.textContent=t<.42?'1':'10';flight.style.left=(startX+(endX-startX)*e)+'px';flight.style.top=(startY+(endY-startY)*e)+'px';flight.style.fontSize=(startSize+(endSize-startSize)*e)+'px';if(t<1)requestAnimationFrame(frame);else{skipCurrent=null;resolve()}}requestAnimationFrame(frame)});working[col+1]+=10;flight.remove();await receiveBundle(col+1,oldTarget,working[col+1]);await wait(1400)}}
async function showSubExpression(col,topValue,bottomValues){const result=resultCells[col],rr=result.getBoundingClientRect(),lr=lesson.getBoundingClientRect(),topSource=borrowEls[col]||q(`.digit[data-row="0"][data-col="${col}"]`),terms=[{value:topValue,source:topSource,borrowed:!!borrowEls[col],row:0}];numbers.slice(1).forEach((number,index)=>{const source=sourceAt(number,index+1,col);if(source)terms.push({value:bottomValues[index],source,borrowed:false,row:index+1})});const baseFont=parseFloat(getComputedStyle(result).fontSize),unitCount=terms.reduce((sum,term)=>sum+String(term.value).length*.62,0)+(terms.length-1)*.62,font=Math.min(baseFont*.68,rr.width*.9/Math.max(1,unitCount)),opFont=font*.62,widths=[];terms.forEach((term,i)=>{widths.push(font*.62*String(term.value).length);if(i<terms.length-1)widths.push(font*.62)});const total=widths.reduce((a,b)=>a+b,0),targetY=rr.top-lr.top+rr.height/2;let cursor=rr.left-lr.left+(rr.width-total)/2;const pieces=[],moving=[];terms.forEach((term,i)=>{const termWidth=font*.62*String(term.value).length,src=term.source.getBoundingClientRect(),el=document.createElement('span'),tx=cursor+termWidth/2;const received=term.source.classList?.contains('receiver-new'),donated=term.source.classList?.contains('donor-new');el.className='fall-token'+(received?' received-term':donated?' donor-term':'');if(received&&term.value>=10)el.innerHTML=`<span class="added-one">${Math.floor(term.value/10)}</span><span>${term.value%10}</span>`;else el.textContent=term.value;el.style.left=(src.left-lr.left+src.width/2)+'px';el.style.top=(src.top-lr.top+src.height/2)+'px';el.style.fontSize=parseFloat(getComputedStyle(term.source).fontSize)+'px';flyLayer.append(el);moving.push({el,sx:src.left-lr.left+src.width/2,sy:src.top-lr.top+src.height/2,ss:parseFloat(el.style.fontSize),tx,ty:targetY,ts:font});pieces.push(el);q(`.digit[data-row="${term.row}"][data-col="${col}"]`).classList.add('column-used');cursor+=termWidth;if(i<terms.length-1){const minus=document.createElement('span');minus.className='fall-plus';minus.textContent='−';minus.style.left=(cursor+font*.31)+'px';minus.style.top=targetY+'px';minus.style.fontSize=opFont+'px';minus.style.opacity='0';flyLayer.append(minus);pieces.push(minus);cursor+=font*.62}});await new Promise(resolve=>{let forced=false,start=performance.now(),duration=4200;skipCurrent=()=>forced=true;function frame(now){const t=forced?1:Math.min(1,(now-start)/duration),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;moving.forEach(m=>{m.el.style.left=(m.sx+(m.tx-m.sx)*e)+'px';m.el.style.top=(m.sy+(m.ty-m.sy)*e)+'px';m.el.style.fontSize=(m.ss+(m.ts-m.ss)*e)+'px'});pieces.filter(x=>x.classList.contains('fall-plus')).forEach(x=>x.style.opacity=Math.max(0,(t-.45)/.35));if(t<1)requestAnimationFrame(frame);else{skipCurrent=null;resolve()}}requestAnimationFrame(frame)});return pieces}
async function flashImpossible(pieces,col){const cell=resultCells[col],rect=cell.getBoundingClientRect(),lr=lesson.getBoundingClientRect(),bolt=document.createElement('span');bolt.className='lightning';bolt.textContent='⚡';bolt.style.left=(rect.left-lr.left+rect.width*.82)+'px';bolt.style.top=(rect.top-lr.top+rect.height*.2)+'px';flyLayer.append(bolt);for(let i=0;i<3;i++){pieces.forEach(piece=>{piece.style.color='#df3131';piece.style.filter='drop-shadow(0 0 9px rgba(220,35,35,.48))';piece.style.opacity='1'});bolt.style.opacity='1';bolt.style.scale='1.12';await wait(420);pieces.forEach(piece=>piece.style.opacity='.14');bolt.style.opacity='0';bolt.style.scale='.72';await wait(330)}pieces.forEach(piece=>piece.style.opacity='0');await wait(650);pieces.forEach(piece=>piece.remove());bolt.remove()}
async function restoreOriginalTask(){const overlays=qa('.borrow-value,.strike-mark');overlays.forEach(el=>{el.style.transition='opacity .9s';el.style.opacity='0'});qa('.digit').forEach(cell=>cell.classList.remove('column-used'));qa('.digit-body').forEach(body=>{body.classList.remove('borrow-old','borrow-faded','receiver-moving');body.style.opacity='';body.style.transform='';body.style.color=''});await wait(950);overlays.forEach(el=>el.remove());borrowEls=[]}
async function calculate(){const working=numbers[0].padStart(cols,'0').split('').map(Number),bottomRows=numbers.slice(1).map(n=>n.padStart(cols,'0').split('').map(Number));for(let col=cols-1;col>=0;col--){const bottomValues=bottomRows.map(row=>row[col]),bottomTotal=bottomValues.reduce((a,b)=>a+b,0);if(working[col]<bottomTotal){const failedPieces=await showSubExpression(col,working[col],bottomValues);await wait(1200);await flashImpossible(failedPieces,col);while(working[col]<bottomTotal){let donor=col-1;while(donor>=0&&working[donor]===0)donor--;if(donor>=0)await unbundle(donor,col,working);else break}}const pieces=await showSubExpression(col,working[col],bottomValues);await wait(2200);const difference=working[col]-bottomTotal,cell=resultCells[col];await replaceExpression(pieces,cell,difference);await wait(2900)}const finalText=(BigInt(numbers[0])-numbers.slice(1).reduce((total,n)=>total+BigInt(n),0n)).toString(),leading=cols-finalText.length;resultCells.forEach((cell,index)=>{if(index<leading)cell.querySelector('.result-value').textContent=''});await wait(1000);await restoreOriginalTask();await wait(900);board.classList.add('done');await wait(3500);restart.classList.add('show')}
async function begin(){if(busy)return;const parsed=parseInput();if(!parsed)return;busy=true;numbers=parsed;if(!build()){busy=false;return}board.classList.add('ready');startPositions();await wait(250);prompt.classList.add('hide');await wait(450);board.classList.add('arranged');await wait(5000);board.classList.add('grid-visible');await wait(1200);board.classList.add('line');await wait(4800);await calculate()}
solve.addEventListener('click',begin);input.addEventListener('input',()=>error.classList.remove('show'));restart.addEventListener('click',()=>location.reload());addEventListener('resize',()=>{if(numbers.length)sizeGrid()});addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();if(skipCurrent){const f=skipCurrent;skipCurrent=null;f()}else if(!busy)begin()});
